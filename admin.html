<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Sesame 管理統計</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a;margin:0}main{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.big{font-size:28px;font-weight:850}.muted{color:#667085;font-size:13px}.table{margin-top:14px;overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="card"><h1>Open Sesame 使用統計</h1><div class="muted">匿名統計｜不記錄姓名、Email 或完整 IP</div><div id="updated" class="muted" style="margin-top:6px">載入中…</div></div><div id="cards" class="grid" style="margin-top:12px"></div><div class="table"><table><thead><tr><th>日期</th><th>瀏覽</th><th>更新鍵</th><th>真正啟動</th><th>加入既有更新</th><th>冷卻擋下</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const API='https://open-sesame-trigger.vercel.app';const f=n=>Number(n||0).toLocaleString('zh-TW');async function load(){const r=await fetch(API+'/api/stats?ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'stats failed');document.getElementById('updated').textContent='統計更新：'+new Date(d.generated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});const cs=[['今日不同訪客',d.today_unique_visitors],['累計不同訪客',d.unique_visitors],['累計瀏覽',d.page_views],['更新鍵點擊',d.manual_update_clicks],['真正啟動更新',d.actual_dispatches],['多人共用既有更新',d.joined_existing],['15分鐘冷卻擋下',d.cooldown_blocked],['前端完成顯示',d.success_ui]];document.getElementById('cards').innerHTML=cs.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${f(x[1])}</div></div>`).join('');document.getElementById('rows').innerHTML=[...(d.daily||[])].reverse().map(x=>`<tr><td>${x.date}</td><td>${f(x.page_view)}</td><td>${f(x.manual_update_click)}</td><td>${f(x.update_dispatched)}</td><td>${f(x.update_joined)}</td><td>${f(x.update_cooldown)}</td></tr>`).join('')}load().catch(e=>document.getElementById('updated').textContent='⚠ '+e.message);</script></body></html>
