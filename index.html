<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 台股六條件選股 Dashboard</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a;margin:0}main{max-width:1200px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:24px;margin:0 0 5px}.muted{color:#667085;font-size:13px}button{background:#1769e0;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.big{font-size:24px;font-weight:850}
.table{margin-top:12px;overflow:auto;background:#fff;border-radius:16px;border:1px solid #e5e7eb}table{width:100%;min-width:900px;border-collapse:collapse}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#fafafa}.g{color:#16803c;font-weight:800}.r{color:#b42318;font-weight:800}
.tag{display:inline-block;border-radius:99px;padding:5px 8px;font-weight:800;font-size:12px}.buy{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}
.note{margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px;font-size:12px;line-height:1.55}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column;align-items:flex-start}}
</style></head>
<body><main>
<section class="head card"><div><h1>🔥 AI 台股六條件選股 Dashboard</h1><div class="muted">每日盤後自動更新｜價量・投信・KD・月週線・融資・相對大盤</div></div><button onclick="loadData()">↻ 更新</button></section>
<div id="summary" class="grid"></div>
<div class="table"><table><thead><tr><th>排名</th><th>股票</th><th>收盤</th><th>成交量</th><th>投信</th><th>月/週</th><th>KD</th><th>相對大盤</th><th>融資</th><th>訊號</th></tr></thead><tbody id="tbody"><tr><td colspan="10">載入中…</td></tr></tbody></table></div>
<div class="note"><b>免責：</b>本網站為每日盤後量化篩選工具，不保證獲利，也不是投資建議。資料以交易所公開資料為準；盤中即時報價不包含在本免費版。</div>
</main>
<script>
async function loadData(){const s=document.getElementById('tbody');try{const r=await fetch('data/dashboard.json?ts='+Date.now(),{cache:'no-store'}),d=await r.json();
document.getElementById('summary').innerHTML=
`<div class="card"><div class="muted">資料時間</div><div class="big">${d.updated_at?new Date(d.updated_at).toLocaleString('zh-TW'):'—'}</div></div>
<div class="card"><div class="muted">追蹤股數</div><div class="big">${d.stocks.length}</div></div>
<div class="card"><div class="muted">大盤融資</div><div class="big">${d.market?.finance_today?Math.round(d.market.finance_today).toLocaleString()+'百萬元':'—'}</div></div>
<div class="card"><div class="muted">模式</div><div class="big">盤後</div><span class="tag buy">每日自動</span></div>`;
s.innerHTML=d.stocks.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.code} ${x.name}</b></td><td>${x.close??'—'}</td><td>${x.volume?x.volume.toLocaleString()+'張':'—'}</td><td class="${x.trust_net>0?'g':x.trust_net<0?'r':''}">${x.trust_net?x.trust_net.toLocaleString()+'張':'—'}</td><td>${x.month_week||'待計算'}</td><td>${x.kd||'待計算'}</td><td>${x.relative||'待計算'}</td><td>${x.margin||'待計算'}</td><td><span class="tag wait">${x.status||'觀察'}</span></td></tr>`).join('');
}catch(e){s.innerHTML='<tr><td colspan="10">尚未產生資料，請到 GitHub Actions 手動執行一次更新。</td></tr>'}}
loadData();
</script></body></html>
