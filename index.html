<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AI 台股六條件選股 Dashboard</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a;margin:0}main{max-width:1280px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:24px;margin:0 0 5px}.muted{color:#667085;font-size:13px}button{background:#1769e0;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.big{font-size:22px;font-weight:850}.table{margin-top:12px;overflow:auto;background:#fff;border-radius:16px;border:1px solid #e5e7eb}table{width:100%;min-width:1150px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{background:#fafafa;white-space:nowrap}.g{color:#16803c;font-weight:800}.r{color:#b42318;font-weight:800}.tag{display:inline-block;border-radius:99px;padding:4px 8px;font-weight:800;font-size:12px}.buy{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.pri{background:#166534;color:#fff;padding:5px 10px;font-size:13px}.vol{background:#ffedd5;color:#9a3412}.chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}.chip{border-radius:6px;padding:2px 5px;font-size:11px;font-weight:700;background:#f1f5f9;color:#94a3b8}.chip.ok{background:#dcfce7;color:#166534}.reason{font-size:12px;line-height:1.45;max-width:260px;color:#334155}.note,.hint,.source-note{margin-top:12px;border-radius:12px;padding:11px;font-size:12px;line-height:1.6}.note{background:#fff7ed;border:1px solid #fed7aa}.hint{background:#eff6ff;border:1px solid #bfdbfe}.source-note{background:#f8fafc;border:1px solid #cbd5e1}.source-row{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:4px}.source-row b{color:#0f172a}.progress-wrap{display:none;margin-top:10px;text-align:left;min-width:270px}.progress-wrap.active{display:block}.progress-line{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:#1769e0;transition:width .35s}.progress-text{margin-top:5px;font-size:12px;font-weight:700}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #dbeafe;border-top-color:#1769e0;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column;align-items:flex-start}}</style></head>
<body><main><section class="head card"><div><h1>🔥 AI 台股六條件選股 Dashboard</h1><div class="muted">每日盤後自動更新｜價量・投信・KD・月週線・融資・相對大盤｜正式版 2026-09-02</div></div><div style="text-align:right"><button id="reload" onclick="manualUpdate()">↻ 手動更新</button><div id="progressWrap" class="progress-wrap"><div class="progress-line"><div id="progressBar" class="progress-bar"></div></div><div id="progressText" class="progress-text">準備更新… 0%</div></div><div id="loadmsg" class="muted" style="margin-top:6px"></div></div></section><div id="summary" class="grid"></div><div id="sourceDates" class="source-note"><b>🕒 TWSE 資料日期</b><div class="muted">載入中…</div></div><div class="table"><table><thead><tr><th>排名</th><th>股票</th><th>收盤</th><th>漲跌</th><th>成交量</th><th>投信</th><th>月/週</th><th>KD</th><th>相對大盤</th><th>融資</th><th>訊號</th><th>最新理由(做多誘因)</th></tr></thead><tbody id="tbody"><tr><td colspan="12">載入中…</td></tr></table></div><div class="hint"><b>📈 操作提示:</b>當<b>大盤趨勢向上</b>時,順著 <b>60 日均線(60K)</b>操作。<b>⭐ 優先買入</b>=月週線向上、KD 黃金交叉、投信買超、大盤轉強同時符合。</div><div class="note"><b>免責:</b>本網站為每日盤後量化篩選工具，「優先買入」只是量化訊號，不保證獲利，也不是投資建議。資料以交易所公開資料為準。</div></main>
<script>
const API='https://open-sesame-trigger.vercel.app';const RAW='https://raw.githubusercontent.com/arischuang1688-sudo/open-sesame/main/data/dashboard.json';const P='資料待補';const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d>0?d:2});const pct=n=>n==null?'':`(${n>0?'+':''}${n}%)`;
function id(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)}function visitorId(){let v=localStorage.getItem('os_vid');if(!v){v=id('v');localStorage.setItem('os_vid',v)}return v}function sessionId(){let s=sessionStorage.getItem('os_sid');if(!s){s=id('s');sessionStorage.setItem('os_sid',s)}return s}function event(name){fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:name,visitor_id:visitorId(),session_id:sessionId()}),keepalive:true}).catch(()=>{})}if(!sessionStorage.getItem('os_pv')){sessionStorage.setItem('os_pv','1');event('page_view')}
function condChips(c){if(!c)return'';return `<div class="chips">${[['ma','月週線↑'],['kd','KD交叉'],['trust','投信買超'],['market','大盤轉強']].map(([k,t])=>`<span class="chip ${c[k]?'ok':''}">${c[k]?'✓':'✗'}${t}</span>`).join('')}</div>`}function progress(p,t,spin=true){document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressText').innerHTML=(spin?'<span class="spinner"></span>':'')+t+' '+p+'%'}
function renderSourceDates(d){const s=d.source_dates||{},q=d.market?.quote,mg=d.market?.margin,h=mg?.history||[];const stock=s.stock_quote||'交易所最新快照';const market=s.market_index||q?.date||'—';const trust=s.institutional||d.trust_date||'—';const margin=s.margin||(h.length?h[h.length-1].date:'—');document.getElementById('sourceDates').innerHTML=`<b>🕒 TWSE 各資料來源日期</b><div class="source-row"><span>個股盤後行情：<b>${stock}</b></span><span>大盤指數：<b>${market}</b></span><span>投信：<b>${trust}</b></span><span>融資：<b>${margin}</b></span></div><div class="muted">${s.note||'各資料集發布時間可能不同，畫面採用 TWSE 當下可取得的最新資料。'}</div>`}
function renderData(d){const q=d.market?.quote,mg=d.market?.margin;renderSourceDates(d);document.getElementById('summary').innerHTML=`<div class="card"><div class="muted">本次產生時間</div><div class="big">${d.updated_at?new Date(d.updated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'—'}</div></div><div class="card"><div class="muted">大盤加權指數</div><div class="big">${q?fmt(q.index,2):P}</div></div><div class="card"><div class="muted">大盤成交值</div><div class="big">${q&&q.amount!=null?fmt(q.amount)+' 億':P}</div></div><div class="card"><div class="muted">大盤融資餘額</div><div class="big">${mg?fmt(mg.balance)+' 億':P}</div></div><div class="card"><div class="muted">追蹤股數</div><div class="big">${d.stocks.length}</div></div><div class="card"><div class="muted">⭐ 優先買入</div><div class="big">${d.stocks.filter(x=>x.priority).length} 檔</div></div><div class="card"><div class="muted">量增檔數</div><div class="big">${d.stocks.filter(x=>x.vol_surge).length} 檔</div></div><div class="card"><div class="muted">模式</div><div class="big">盤後</div><span class="tag buy">TWSE 最新可用</span></div>`;const rows=[...d.stocks].sort((a,b)=>(b.priority?1:0)-(a.priority?1:0)||(b.cond_count||0)-(a.cond_count||0));document.getElementById('tbody').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.code} ${x.name}</b></td><td>${x.close??'—'}</td><td class="${x.change>0?'r':x.change<0?'g':''}">${x.change>0?'+':''}${x.change??'—'} ${pct(x.change_pct)}</td><td>${x.volume?fmt(x.volume)+'張':'—'}${x.vol_surge?' <span class="tag vol">量增</span>':''}</td><td>${x.trust_net!=null?fmt(x.trust_net)+'張':P}</td><td>${x.month_week||'待計算'}</td><td>${x.kd||'待計算'}</td><td>${x.relative||'待計算'}</td><td>${x.margin||'待計算'}</td><td>${x.priority?'<span class="tag pri">⭐ 優先買入</span>':`<span class="tag wait">${x.status||'觀察'}</span>`}${condChips(x.conditions)}</td><td><div class="reason">${x.reason||'—'}</div></td></tr>`).join('')}
async function fetchDashboard(){const r=await fetch('data/dashboard.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('dashboard');return r.json()}async function fetchRawDashboard(){const r=await fetch(RAW+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('github data');return r.json()}async function fetchRunStatus(requestId){const r=await fetch(API+'/api/status?request_id='+encodeURIComponent(requestId)+'&ts='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return r.json()}async function loadData(){const d=await fetchDashboard();renderData(d);return d}
async function manualUpdate(){const btn=document.getElementById('reload'),pw=document.getElementById('progressWrap'),msg=document.getElementById('loadmsg'),requestId=id('web');event('manual_update_click');btn.disabled=true;btn.textContent='↻ 更新處理中…';pw.classList.add('active');progress(2,'讀取目前資料');msg.textContent='準備更新…';try{const before=await fetchDashboard(),beforeTime=Date.parse(before.updated_at||'')||0,tr=await fetch(API+'/api/trigger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:requestId,visitor_id:visitorId()}),cache:'no-store'});let tj={};try{tj=await tr.json()}catch{}if(!tr.ok)throw Error(tj.detail||tj.error||'trigger failed');if(tj.action==='cooldown'){progress(100,'資料已是最新',false);msg.textContent='✓ 15 分鐘內已更新過，直接使用目前最新資料';event('manual_update_success');return}msg.textContent=tj.action==='joined'?'已有其他使用者正在更新，已自動共用同一份更新結果…':'已啟動一次更新，其他使用者會共用這次結果…';const started=Date.now();let rawReady=false;while(Date.now()-started<600000){await new Promise(r=>setTimeout(r,4000));const status=await fetchRunStatus(requestId).catch(()=>null);if(status?.failed){progress(status.percent||80,status.validation_pending?'核心資料日期尚未同步':'本次更新未發布',false);msg.textContent='⚠ '+(status.message||'本次更新未通過完整資料驗證或執行失敗。為避免發布不完整或不同交易日混合資料，網站已保留上一份通過驗證的正確資料；稍後核心資料更新齊全後再重新執行即可。');event('manual_update_error');return}const elapsed=Date.now()-started,p=Math.min(96,status?.percent||15+Math.floor(elapsed/7500));if(status?.label)progress(p,status.label);if(!rawReady){try{const raw=await fetchRawDashboard(),rt=Date.parse(raw.updated_at||'')||0;if(rt>beforeTime){rawReady=true;msg.textContent='✓ 新資料已產生，等待 GitHub Pages 發布…';progress(Math.max(p,90),'新資料完成，等待網站發布')}}catch{}}const d=await fetchDashboard(),t=Date.parse(d.updated_at||'')||0;if(t>beforeTime){renderData(d);progress(100,'GitHub Pages 更新完成',false);msg.textContent='✓ 最新可用資料已重新載入';event('manual_update_success');return}}event('manual_update_timeout');if(rawReady)throw Error('新資料已產生，但網站發布尚未完成，重新整理頁面即可看到最新資料');throw Error('更新逾時，請稍後重新整理');}catch(e){event('manual_update_error');progress(100,'更新狀態',false);msg.textContent='⚠ '+e.message}finally{btn.disabled=false;btn.textContent='↻ 手動更新';setTimeout(()=>pw.classList.remove('active'),7000)}}
loadData().catch(()=>document.getElementById('tbody').innerHTML='<tr><td colspan="12">尚未產生資料。</td></tr>');
</script></body></html>
