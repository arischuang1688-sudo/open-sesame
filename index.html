<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 台股六條件選股 Dashboard</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a;margin:0}main{max-width:1280px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:24px;margin:0 0 5px}.muted{color:#667085;font-size:13px}button{background:#1769e0;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.big{font-size:22px;font-weight:850}.table{margin-top:12px;overflow:auto;background:#fff;border-radius:16px;border:1px solid #e5e7eb}table{width:100%;min-width:1150px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{background:#fafafa;white-space:nowrap}.g{color:#16803c;font-weight:800}.r{color:#b42318;font-weight:800}.tag{display:inline-block;border-radius:99px;padding:4px 8px;font-weight:800;font-size:12px}.buy{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.pri{background:#166534;color:#fff;padding:5px 10px;font-size:13px}.vol{background:#ffedd5;color:#9a3412}.mup{background:#fee2e2;color:#b91c1c}.mdn{background:#dbeafe;color:#1d4ed8}.chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}.chip{border-radius:6px;padding:2px 5px;font-size:11px;font-weight:700;background:#f1f5f9;color:#94a3b8}.chip.ok{background:#dcfce7;color:#166534}.reason{font-size:12px;line-height:1.45;max-width:260px;color:#334155}.note,.hint{margin-top:12px;border-radius:12px;padding:11px;font-size:12px;line-height:1.6}.note{background:#fff7ed;border:1px solid #fed7aa}.hint{background:#eff6ff;border:1px solid #bfdbfe}.progress-wrap{display:none;margin-top:10px;text-align:left;min-width:270px}.progress-wrap.active{display:block}.progress-line{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:#1769e0;transition:width .35s}.progress-text{margin-top:5px;font-size:12px;font-weight:700}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #dbeafe;border-top-color:#1769e0;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column;align-items:flex-start}}</style></head>
<body><main><section class="head card"><div><h1>🔥 AI 台股六條件選股 Dashboard</h1><div class="muted">每日盤後自動更新｜價量・投信・KD・月週線・融資・相對大盤</div></div><div style="text-align:right"><button id="reload" onclick="manualUpdate()">↻ 手動更新</button><div id="progressWrap" class="progress-wrap"><div class="progress-line"><div id="progressBar" class="progress-bar"></div></div><div id="progressText" class="progress-text">準備更新… 0%</div></div><div id="loadmsg" class="muted" style="margin-top:6px"></div></div></section><div id="summary" class="grid"></div><div class="table"><table><thead><tr><th>排名</th><th>股票</th><th>收盤</th><th>漲跌</th><th>成交量</th><th>投信</th><th>月/週</th><th>KD</th><th>相對大盤</th><th>融資</th><th>訊號</th><th>最新理由(做多誘因)</th></tr></thead><tbody id="tbody"><tr><td colspan="12">載入中…</td></tr></table></div><div class="hint"><b>📈 操作提示:</b>當<b>大盤趨勢向上</b>時,順著 <b>60 日均線(60K)</b>操作。<b>⭐ 優先買入</b>=月週線向上、KD 黃金交叉、投信買超、大盤轉強同時符合。</div><div class="note"><b>免責:</b>本網站為每日盤後量化篩選工具，「優先買入」只是量化訊號，不保證獲利，也不是投資建議。資料以交易所公開資料為準。</div></main>
<script>
const API='https://open-sesame-trigger.vercel.app';const P='資料待補';const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d>0?d:2});const pct=n=>n==null?'':`(${n>0?'+':''}${n}%)`;
function condChips(c){if(!c)return'';return `<div class="chips">${[['ma','月週線↑'],['kd','KD交叉'],['trust','投信買超'],['market','大盤轉強']].map(([k,t])=>`<span class="chip ${c[k]?'ok':''}">${c[k]?'✓':'✗'}${t}</span>`).join('')}</div>`}
function progress(p,t,spin=true){document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressText').innerHTML=(spin?'<span class="spinner"></span>':'')+t+' '+p+'%'}
function renderData(d){const q=d.market?.quote,mg=d.market?.margin;document.getElementById('summary').innerHTML=`<div class="card"><div class="muted">資料時間</div><div class="big">${d.updated_at?new Date(d.updated_at).toLocaleString('zh-TW'):'—'}</div></div><div class="card"><div class="muted">大盤加權指數</div><div class="big">${q?fmt(q.index,2):P}</div></div><div class="card"><div class="muted">大盤成交值</div><div class="big">${q&&q.amount!=null?fmt(q.amount)+' 億':P}</div></div><div class="card"><div class="muted">大盤融資餘額</div><div class="big">${mg?fmt(mg.balance)+' 億':P}</div></div><div class="card"><div class="muted">追蹤股數</div><div class="big">${d.stocks.length}</div></div><div class="card"><div class="muted">⭐ 優先買入</div><div class="big">${d.stocks.filter(x=>x.priority).length} 檔</div></div><div class="card"><div class="muted">量增檔數</div><div class="big">${d.stocks.filter(x=>x.vol_surge).length} 檔</div></div><div class="card"><div class="muted">模式</div><div class="big">盤後</div><span class="tag buy">每日自動</span></div>`;const rows=[...d.stocks].sort((a,b)=>(b.priority?1:0)-(a.priority?1:0)||(b.cond_count||0)-(a.cond_count||0));document.getElementById('tbody').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.code} ${x.name}</b></td><td>${x.close??'—'}</td><td class="${x.change>0?'r':x.change<0?'g':''}">${x.change>0?'+':''}${x.change??'—'} ${pct(x.change_pct)}</td><td>${x.volume?fmt(x.volume)+'張':'—'}${x.vol_surge?' <span class="tag vol">量增</span>':''}</td><td>${x.trust_net!=null?fmt(x.trust_net)+'張':P}</td><td>${x.month_week||'待計算'}</td><td>${x.kd||'待計算'}</td><td>${x.relative||'待計算'}</td><td>${x.margin||'待計算'}</td><td>${x.priority?'<span class="tag pri">⭐ 優先買入</span>':`<span class="tag wait">${x.status||'觀察'}</span>`}${condChips(x.conditions)}</td><td><div class="reason">${x.reason||'—'}</div></td></tr>`).join('')}
async function loadData(){const r=await fetch('data/dashboard.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('dashboard');const d=await r.json();renderData(d)}
async function manualUpdate(){const btn=document.getElementById('reload'),pw=document.getElementById('progressWrap'),msg=document.getElementById('loadmsg');btn.disabled=true;btn.textContent='↻ GitHub Actions 執行中…';pw.classList.add('active');progress(2,'安全啟動 GitHub Actions');msg.textContent='正在建立更新工作…';try{const tr=await fetch(API+'/api/trigger',{method:'POST',cache:'no-store'});const tj=await tr.json();if(!tr.ok)throw Error(tj.detail||tj.error||'trigger failed');let run=tj.run_id;if(!run)throw Error('工作已啟動，但暫時尚未取得 Run ID，請數秒後再試');progress(5,'GitHub Actions 已啟動');while(true){await new Promise(r=>setTimeout(r,2000));const sr=await fetch(API+'/api/status?run_id='+run,{cache:'no-store'}),s=await sr.json();if(!sr.ok)throw Error(s.error||'status failed');progress(s.progress,s.stage,s.status!=='completed');msg.textContent='真實 GitHub Actions 狀態｜Run #'+run;if(s.status==='completed'){if(s.conclusion!=='success')throw Error('GitHub Actions '+s.conclusion);await new Promise(r=>setTimeout(r,2500));await loadData();progress(100,'GitHub Pages 更新完成',false);msg.textContent='✓ 最新資料已重新載入';break}}}catch(e){progress(100,'更新失敗',false);msg.textContent='⚠ '+e.message}finally{btn.disabled=false;btn.textContent='↻ 手動更新';setTimeout(()=>pw.classList.remove('active'),3500)}}
loadData().catch(()=>document.getElementById('tbody').innerHTML='<tr><td colspan="12">尚未產生資料。</td></tr>');
</script></body></html>
