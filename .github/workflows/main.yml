name: Daily Taiwan Stock Update
run-name: "Open Sesame Update ${{ inputs.request_id || 'scheduled' }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Web request ID used for live progress tracking"
        required: false
        type: string
  schedule:
    - cron: "5 21 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 10% Checkout source
        uses: actions/checkout@v4

      - name: 20% Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 30% Read latest available TWSE source dates
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta

          TZ = timezone(timedelta(hours=8))
          stock_url = "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"
          market_url = "https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date={date}&response=json"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def roc_to_iso(v):
              s = str(v or "").replace("/", "").replace(".", "")
              if len(s) >= 7 and s[:3].isdigit():
                  return f"{int(s[:3])+1911:04d}-{s[3:5]}-{s[5:7]}"
              return None

          now = datetime.now(TZ)
          stock_date = None
          market_date = None
          try:
              rows = get(stock_url)
              dates = [roc_to_iso(r.get("Date")) for r in rows if r.get("Date")]
              dates = [x for x in dates if x]
              stock_date = max(dates) if dates else None
          except Exception as e:
              print(f"[warn] STOCK_DAY_ALL date unavailable: {e}")

          try:
              resp = get(market_url.format(date=now.strftime("%Y%m") + "01"))
              dates = [roc_to_iso(r[0]) for r in resp.get("data", []) if r]
              dates = [x for x in dates if x]
              market_date = max(dates) if dates else None
          except Exception as e:
              print(f"[warn] FMTQIK date unavailable: {e}")

          print(f"[info] Latest currently available TWSE data: STOCK_DAY_ALL={stock_date}, FMTQIK={market_date}")
          print("[info] Different TWSE datasets may publish at different times; workflow will use each source's latest available data.")
          PY

      - name: 60% Download market data and calculate technical analysis
        run: python scripts/update_data.py

      - name: 85% Finalize ranking and source dates
        run: |
          python - <<'PY'
          import json, urllib.request

          p = "data/dashboard.json"
          with open(p, encoding="utf-8") as f:
              d = json.load(f)

          stocks = d.get("stocks", [])
          stocks.sort(key=lambda x: (bool(x.get("priority")), x.get("cond_count", 0), x.get("change_pct", 0), x.get("volume", 0)), reverse=True)
          d["stocks"] = stocks

          def roc_to_iso(v):
              s = str(v or "").replace("/", "").replace(".", "")
              if len(s) >= 7 and s[:3].isdigit():
                  return f"{int(s[:3])+1911:04d}-{s[3:5]}-{s[5:7]}"
              return None

          stock_date = None
          try:
              req = urllib.request.Request(
                  "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
                  headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  rows = json.loads(r.read().decode("utf-8"))
              dates = [roc_to_iso(x.get("Date")) for x in rows if x.get("Date")]
              dates = [x for x in dates if x]
              stock_date = max(dates) if dates else None
          except Exception as e:
              print(f"[warn] cannot annotate STOCK_DAY_ALL date: {e}")

          market = d.get("market", {})
          quote = market.get("quote") or {}
          margin = market.get("margin") or {}
          margin_hist = margin.get("history") or []
          d["source_dates"] = {
              "stock_quote": stock_date,
              "market_index": quote.get("date"),
              "institutional": d.get("trust_date"),
              "margin": margin_hist[-1].get("date") if margin_hist else None,
              "generated_at": d.get("updated_at"),
              "note": "各 TWSE 資料集發布時間不同，本頁使用各來源目前可取得的最新資料。"
          }

          with open(p, "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
          print(f"[rank] finalized {len(stocks)} stocks")
          print(f"[dates] {d['source_dates']}")
          PY

      - name: 95% Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily Taiwan stock update"
            git push
          fi

      - name: 100% Update workflow finished
        run: echo "Open Sesame update workflow completed successfully."
