name: Offline regression tests

on:
  push:
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/regression-tests.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'vercel/**'
      - 'index.html'
      - 'app-v2.html'
      - 'admin.html'
      - 'data/trading_calendar/**'
  pull_request:
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/regression-tests.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'vercel/**'
      - 'index.html'
      - 'app-v2.html'
      - 'admin.html'
      - 'data/trading_calendar/**'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify calendar, workflow guards and all 200 quotes without TWSE requests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify dashboard valuation and anonymous analytics without external requests
        run: node --test tests/test_*.mjs
