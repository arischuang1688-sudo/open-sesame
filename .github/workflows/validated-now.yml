name: Validated Taiwan Stock Update Now
on:
  push:
    paths:
      - '.github/force-update'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate latest TWSE data
        run: python scripts/update_data_strict.py
      - name: Strict validate latest trading day
        run: |
          python - <<'PY'
          import json, urllib.request, sys
          p='data/dashboard.json'
          d=json.load(open(p,encoding='utf-8'))
          def get(u):
            r=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            return json.loads(urllib.request.urlopen(r,timeout=45).read().decode())
          def num(v):
            try:return float(str(v).replace(',','').replace('+',''))
            except:return None
          market=d.get('market') or {}; quote=market.get('quote') or {}; base=quote.get('date')
          trust=d.get('trust_date'); mh=((market.get('margin') or {}).get('history') or []); margin=mh[-1].get('date') if mh else None
          if not base: sys.exit('VALIDATION FAILED: market date missing')
          ymd=base.replace('-','')
          resp=get(f'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={ymd}&type=ALLBUT0999&response=json')
          table=None
          for t in resp.get('tables',[]):
            f=t.get('fields',[])
            if '證券代號' in f and '證券名稱' in f and '收盤價' in f:
              table=t; break
          if not table: sys.exit('VALIDATION FAILED: MI_INDEX stock table missing')
          fields=table.get('fields',[]); rows=table.get('data',[])
          ic=fields.index('證券代號'); iclose=fields.index('收盤價'); ivol=fields.index('成交股數')
          by={str(r[ic]).strip():r for r in rows}
          dates={'stock_quote':base,'market_index':base,'institutional':trust,'margin':margin}
          print('[validate]',dates)
          if any(not v for v in dates.values()) or any(v!=base for v in dates.values()): sys.exit('VALIDATION FAILED: core sources are not the same latest trading day')
          errors=[]; checked=0
          for s in (d.get('stocks') or [])[:50]:
            code=str(s.get('code','')).strip(); src=by.get(code)
            if not src: errors.append(code+':missing'); continue
            a=num(src[iclose]); b=num(s.get('close')); av=num(src[ivol]); bv=num(s.get('volume'))
            if a is None or b is None or abs(a-b)>0.0001: errors.append(code+':close')
            if av is not None and bv is not None and abs(av/1000-bv)>0.02: errors.append(code+':volume')
            checked+=1
          if errors: sys.exit('VALIDATION FAILED: '+','.join(errors[:20]))
          if checked < 30: sys.exit(f'VALIDATION FAILED: only {checked} stock quotes checked')
          d['validation']={'status':'passed','trading_date':base,'same_day_sources':True,'stock_quotes_checked':checked,'stock_quote_source':'TWSE MI_INDEX'}
          d['source_dates']={**dates,'generated_at':d.get('updated_at'),'note':f'嚴格同交易日驗證已通過：核心 TWSE 資料與個股 MI_INDEX 行情均為 {base}。'}
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('[validate] PASSED',base,checked)
          PY
      - name: Publish validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if git diff --cached --quiet; then echo 'No data changes'; else git commit -m 'Daily Taiwan stock update (MI_INDEX validated)'; git push; fi
